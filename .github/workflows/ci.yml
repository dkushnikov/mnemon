# CI — staged (2026-10-17): a lint job and the suites on two hosts. Not a required check yet:
# that comes after a week of green runs (maintainer decision). Releases stay manual (`mnemon release`).
name: ci

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (bash -n · py_compile · hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every shell script (by shebang)
        run: |
          set -eu
          n=0
          while IFS= read -r f; do
            bash -n "$f"
            n=$((n + 1))
          done < <(git ls-files | while IFS= read -r f; do
                     [ -f "$f" ] || continue
                     case "$(head -c 64 "$f" | head -n 1)" in '#!'*bash*|'#!/bin/sh'*) printf '%s\n' "$f" ;; esac
                   done)
          echo "bash -n: $n scripts parse"
          [ "$n" -gt 20 ] || { echo "too few scripts found ($n) — the detection broke"; exit 1; }

      - name: python -m py_compile on every python source (-W error)
        run: |
          set -eu
          git ls-files '*.py' | grep -v '/__pycache__/' > /tmp/py-files
          n="$(wc -l < /tmp/py-files | tr -d ' ')"
          xargs python3 -W error -m py_compile < /tmp/py-files
          echo "py_compile: $n sources compile"
          [ "$n" -gt 20 ] || { echo "too few python sources found ($n)"; exit 1; }

      - name: hygiene suite (public-repo gates, manifests, skill path form, fixtures)
        run: bash tests/test_hygiene.sh

  suites:
    name: suites (${{ matrix.os }} · ${{ matrix.toolchain }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest toolchain the engine supports: the system bash 3.2 and python 3.9 of macOS,
          # selected by run-suites.sh --legacy (PATH=/usr/bin:/bin first; every suite asserts it).
          # Pinned to an image known to carry that exact toolchain: on another image the runner
          # refuses with exit 2 ("legacy toolchain … is not available") before any suite runs —
          # move the pin deliberately, after checking /usr/bin/python3 there.
          - os: macos-15
            toolchain: legacy
            args: --legacy -k
          # a current toolchain on another OS: the distribution's bash 5 and python 3
          - os: ubuntu-latest
            toolchain: current
            args: -k
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: the tools the engine and the suites expect on PATH
        # pandoc is the one optional engine dependency the suites use for real (the .md file capture, the
        # defuddle → pandoc fallback, the converter fixtures); the runner images do not ship it. Two rules:
        # (1) the version is pinned to the one the engine is developed and tested against — brew's newest
        #     (3.11 on the first run) escapes `[TABLE]` inside a code example and the fixtures fail; bump
        #     PANDOC_VERSION deliberately, with the suites;
        # (2) it must live OUTSIDE /usr/bin:/bin — two tests simulate "no pandoc" with exactly that PATH
        #     (a fixture marked without_pandoc, the doctor's "pandoc missing" line), so apt's /usr/bin/pandoc
        #     made them fail on the first run. The official release archive goes under $RUNNER_TEMP on both
        #     hosts. The rest is stubbed or present (jq, shasum, pgrep, git, python3).
        env:
          GH_TOKEN: ${{ github.token }}
          PANDOC_VERSION: 3.9.0.2
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            command -v jq >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q jq; } || { echo "apt-get install jq failed"; exit 1; }
            asset="pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          else
            asset="pandoc-${PANDOC_VERSION}-arm64-macOS.zip"
          fi
          mkdir -p "$RUNNER_TEMP/pandoc"
          gh release download "$PANDOC_VERSION" --repo jgm/pandoc --pattern "$asset" --dir "$RUNNER_TEMP/pandoc" || { echo "pandoc $PANDOC_VERSION ($asset) download failed"; exit 1; }
          case "$asset" in *.tar.gz) tar -xzf "$RUNNER_TEMP/pandoc/$asset" -C "$RUNNER_TEMP/pandoc" ;; *.zip) unzip -q "$RUNNER_TEMP/pandoc/$asset" -d "$RUNNER_TEMP/pandoc" ;; esac
          pandoc_bin="$(find "$RUNNER_TEMP/pandoc" -type f -name pandoc -perm -u+x | head -1)"
          [ -n "$pandoc_bin" ] || { echo "no pandoc binary inside $asset"; exit 1; }
          chmod +x "$pandoc_bin"
          echo "$(dirname "$pandoc_bin")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$pandoc_bin"):$PATH"
          case "$(command -v pandoc)" in /usr/bin/*|/bin/*) echo "pandoc at $(command -v pandoc) would defeat the suites' no-pandoc PATH"; exit 1 ;; esac
          pandoc --version | head -1 | grep -q "pandoc ${PANDOC_VERSION}" || { echo "pandoc on PATH is not ${PANDOC_VERSION}: $(pandoc --version | head -1)"; exit 1; }
          missing=0
          for t in git bash python3 jq shasum pgrep pandoc; do
            if command -v "$t" >/dev/null 2>&1; then printf '%-8s %s\n' "$t" "$(command -v "$t")"; else echo "MISSING: $t"; missing=1; fi
          done
          echo "---"; bash --version | head -1; python3 --version; pandoc --version | head -1
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash --version | head -1; /usr/bin/python3 --version; fi
          [ "$missing" -eq 0 ] || { echo "a required tool is missing — the suites would fail on it"; exit 1; }

      - name: run every suite
        run: tests/run-suites.sh ${{ matrix.args }} --logs "$RUNNER_TEMP/suite-logs"

      - name: keep the suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.os }}-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/suite-logs
          if-no-files-found: ignore
          retention-days: 14
